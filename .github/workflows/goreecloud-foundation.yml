name: GoreeCloud Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/goreecloud/**'
      - 'server/src/goreecloud/**'
      - '.github/workflows/goreecloud-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/goreecloud/**'
      - 'server/src/goreecloud/**'
      - '.github/workflows/goreecloud-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    name: Validate GoreeCloud fork foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate governance and native-transition records
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            LICENSE
            docs/goreecloud/UPSTREAM.md
            docs/goreecloud/PRODUCT.md
            docs/goreecloud/ARCHITECTURE.md
            docs/goreecloud/CI-AUDIT.md
            docs/goreecloud/WORKFLOW-CLASSIFICATION.md
            docs/goreecloud/PRIVACY-BOUNDARY.md
            docs/goreecloud/NATIVE-CONTRACTS.md
            server/src/goreecloud/contracts/index.ts
            server/src/goreecloud/contracts/media-authority.ts
            server/src/goreecloud/contracts/portable-transfer.ts
            server/src/goreecloud/contracts/sync-state.ts
            server/src/goreecloud/contracts/authorization.ts
            server/src/goreecloud/adapters/immich-media-authority.adapter.ts
            server/src/goreecloud/adapters/immich-media-authority.adapter.spec.ts
          )

          for path in "${required_files[@]}"; do
            test -s "$path" || { echo "Required file missing or empty: $path" >&2; exit 1; }
          done

          grep -Fq 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -Fq 'caea849fee509909d42220e327c855cc7de21b2a' docs/goreecloud/UPSTREAM.md
          grep -Fq 'immich-app/immich' docs/goreecloud/UPSTREAM.md
          grep -Fq 'GoreeCloud/goreecloud-gallery' docs/goreecloud/PRODUCT.md
          grep -Fq 'Gallery must not be deleted, overwritten, or repurposed to create Photos.' docs/goreecloud/PRODUCT.md
          grep -Fq 'Photos Vault' docs/goreecloud/ARCHITECTURE.md
          grep -Fq 'Immich independence' docs/goreecloud/ARCHITECTURE.md
          grep -Fq 'PUSH_O_MATIC_APP_CLIENT_ID' docs/goreecloud/CI-AUDIT.md
          grep -Fq 'immich-app/devtools' docs/goreecloud/WORKFLOW-CLASSIFICATION.md
          grep -Fq 'No production migration or runtime cutover is authorized by this document.' docs/goreecloud/PRIVACY-BOUNDARY.md
          grep -Fq 'Photos native contract set 0.1' docs/goreecloud/NATIVE-CONTRACTS.md
          grep -Fq 'A database dump alone is not considered a complete portable user export.' docs/goreecloud/NATIVE-CONTRACTS.md
          grep -Fq 'GoreeCloud Gallery remains independently useful without Photos.' docs/goreecloud/NATIVE-CONTRACTS.md

          grep -Fq "authority: 'original'" server/src/goreecloud/contracts/media-authority.ts
          grep -Fq "format: 'goreecloud-photos-portable-export'" server/src/goreecloud/contracts/portable-transfer.ts
          grep -Fq 'destructiveActionAuthorized' server/src/goreecloud/contracts/sync-state.ts
          grep -Fq 'publicationBoundary' server/src/goreecloud/contracts/authorization.ts

          adapter=server/src/goreecloud/adapters/immich-media-authority.adapter.ts
          adapter_test=server/src/goreecloud/adapters/immich-media-authority.adapter.spec.ts
          grep -Fq 'implements MediaAuthorityProvider' "$adapter"
          grep -Fq "provider: 'immich-inherited-filesystem'" "$adapter"
          grep -Fq 'Read-only compatibility boundary' "$adapter"
          if grep -Eq 'this\.assets\.(create|update|remove|deleteAll|updateAll)\(' "$adapter"; then
            echo 'Read-only adapter contains an AssetRepository write call.' >&2
            exit 1
          fi

          grep -Fq "verifies the inherited SHA-1 checksum without modifying the source file" "$adapter_test"
          grep -Fq "fails closed for missing assets, unsupported checksum algorithms, and filesystem errors" "$adapter_test"
          grep -Fq "throws a bounded error when an original cannot be resolved" "$adapter_test"

          echo 'GoreeCloud Photos fork foundation and native-transition validation passed.'
