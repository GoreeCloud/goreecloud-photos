name: Validate Go Foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, vet, test, PostgreSQL, migrations, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
      GC_PHOTOS_TEST_DATABASE_URL: postgres://photos_test:photos_test@127.0.0.1:5432/goreecloud_photos_test?sslmode=disable

    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:a10c981235b4f635e65df0cfb66a5598064628128505dbc6a3ed4ca303717521
        env:
          POSTGRES_USER: photos_test
          POSTGRES_PASSWORD: photos_test
          POSTGRES_DB: goreecloud_photos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photos_test -d goreecloud_photos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.1"

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files require gofmt:\n%s\n' "$unformatted" >&2
            gofmt -d $unformatted
            exit 1
          fi

      - name: Verify module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Validate migration baseline
        run: python3 scripts/validate_migrations.py

      - name: Build experimental service
        run: go build -o "${RUNNER_TEMP}/goreecloud-photos" ./cmd/photos
