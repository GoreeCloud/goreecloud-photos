name: Validate Repository Baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Repository and contract baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
