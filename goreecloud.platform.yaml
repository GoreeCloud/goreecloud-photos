# GoreeCloud Photos Platform Contract declaration
# Declaration validity does not prove implementation, acceptance, release, or production readiness.

schema_version: "0.4"

component:
  type: application
  id: goreecloud-photos
  product_name: GoreeCloud Photos
  repository: GoreeCloud/goreecloud-photos

lifecycle: experimental
version: "0.1.0-experimental.1"

supported_platforms: []

api:
  versions:
    - "v1-experimental"
  endpoints:
    - name: health
      url: "/api/v1/health"
      purpose: "Return bounded process-health and build/lifecycle identity for the Experimental service."
    - name: readiness
      url: "/api/v1/ready"
      purpose: "Return ready only when the PostgreSQL core schema and original-media storage are both configured and healthy; otherwise fail closed."

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: ["PLATFORM-INTEGRATIONS.md", "ARCHITECTURE.md"]
    notes: "Aggregate administration, storage, queue, policy, backup, and recovery views are architecturally defined; no Photos-specific Manager runtime integration or acceptance exists."
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence: ["PRIVACY POLICY.md", "PLATFORM-INTEGRATIONS.md", "DATA-MODEL.md"]
    notes: "Privacy-sensitive data classes, fail-closed processing, minimization, retention, derived-data separation, and revocation boundaries are defined; no Photos-specific Privacy Shield runtime integration or acceptance exists."
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: ["SECURITY.md", "PLATFORM-INTEGRATIONS.md", "ARCHITECTURE.md"]
    notes: "Untrusted ingestion, worker isolation, authorization, share-link, session, administration, and evidence boundaries are defined; no Photos-specific Wardveil runtime integration or acceptance exists."
  everkeep:
    result: applicable-blocked
    version: null
    evidence: ["RECOVERY.md", "PLATFORM-INTEGRATIONS.md", "FEATURE-ROADMAP.md"]
    notes: "Authoritative/rebuildable data classes, recovery layers, clean-target restore, integrity, portability, migration, and succession boundaries are defined; no Photos-specific Everkeep implementation or acceptance exists."
  glaze_ui:
    result: applicable-blocked
    version: null
    evidence: ["BRANDING.md", "PLATFORM-INTEGRATIONS.md", "ARCHITECTURE.md", "GLAZE-UI-ACCEPTANCE.md"]
    notes: "Glaze UI 1.5.1 is the current required Stable consumer target and platform-native client boundary is defined; no Photos runtime UI or application-specific conformance evidence exists."
  mesh:
    result: applicable-blocked
    version: null
    evidence: ["PLATFORM-INTEGRATIONS.md", "ARCHITECTURE.md"]
    notes: "Capability discovery and minimal cross-application handoff boundaries are defined; no Photos-specific Mesh implementation or acceptance exists."
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: ["PLATFORM-INTEGRATIONS.md", "DATA-MODEL.md", "API.md"]
    notes: "Identity owns authentication/subjects/devices while Photos owns library membership, asset ownership, and domain authorization; no Photos-specific Identity runtime integration or acceptance exists."
  policy:
    result: applicable-blocked
    version: null
    evidence: ["PLATFORM-INTEGRATIONS.md", "API.md"]
    notes: "Photos policy decision points and fail-closed enforcement boundary are defined; no Photos-specific Policy runtime integration or acceptance exists."
  observability:
    result: applicable-blocked
    version: null
    evidence: ["PLATFORM-INTEGRATIONS.md", "ARCHITECTURE.md"]
    notes: "Privacy-minimized operational evidence classes are defined; no Photos-specific Observability integration or acceptance exists."

health:
  health_endpoint: "/api/v1/health"
  readiness_endpoint: "/api/v1/ready"

continuity:
  backup:
    required: true
    requirements:
      - "Original media, authoritative library metadata, ownership, album relationships, user metadata, edit instructions, required sharing state, and authorized recovery material require durable backup."
      - "Generated derivatives and ordinary indexes should remain rebuildable from protected authoritative data whenever practical."
  restore:
    required: true
    requirements:
      - "Clean-target restore must be tested before any production recovery claim."
      - "Restore must validate original-object integrity, ownership, metadata, album organization, sharing state, and representative application-level usability."
  export:
    required: true
    requirements:
      - "Users require selected and full-library export of originals plus portable metadata and a machine-readable library manifest."
  portability:
    required: true
    requirements:
      - "The library must remain reconstructable without relying exclusively on an opaque internal database or on continued availability of GoreeCloud Photos."

external_dependencies: []

compatibility:
  platform_contract: "0.4"
  glaze_ui_required: "1.5.1"
  requires: []
  provides: []

evidence:
  acceptance_tests:
    - internal/config/config_test.go
    - internal/storage/fsstore_test.go
    - internal/database/postgres_integration_test.go
    - internal/httpapi/server_test.go
    - scripts/validate_migrations.py
  release: []

conformance:
  status: unverified
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - FEATURES.md
    - FEATURE-ROADMAP.md
    - ARCHITECTURE.md
    - DATA-MODEL.md
    - API.md
    - RECOVERY.md
    - PLATFORM-INTEGRATIONS.md
    - DEPENDENCIES.md
    - GLAZE-UI-ACCEPTANCE.md
    - SECURITY.md
    - "PRIVACY POLICY.md"
    - goreecloud.platform.yaml
  blockers:
    - "Only an Experimental health/readiness and filesystem-storage foundation exists; no supported Photos service or user-facing client exists."
    - "The executable server, PostgreSQL schema baseline, and PostgreSQL readiness adapter are verified, but no media-upload API, database-backed library workflow, S3-compatible adapter, client implementation, or worker pipeline is implemented."
    - "No Photos-specific acceptance evidence exists for any of the nine Integral Platform Systems."
    - "No Glaze UI 1.5.1 Photos consumer-conformance evidence exists."
    - "No release artifact, deployment, production-readiness evidence, or Stable qualification exists."
